<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đặt mật khẩu mới</title>
    <link rel="stylesheet" href="/admin/css/admin.css" />
    <script defer src="/shared/js/password-visibility.js"></script>
    <script defer src="/auth/js/recovery.js"></script>
  </head>
  <body class="login">
    <main class="login-card">
      <p class="eyebrow">CLOTHING SHOP · KHÔI PHỤC TÀI KHOẢN</p>
      <h1>Đặt mật khẩu mới</h1>
      <form id="reset-form">
        <label
          >Mật khẩu mới<input
            name="password"
            type="password"
            minlength="12"
            maxlength="72"
            autocomplete="new-password"
            required /></label
        ><label
          >Nhập lại mật khẩu<input
            name="confirmation"
            type="password"
            minlength="12"
            maxlength="72"
            autocomplete="new-password"
            required
        /></label>
        <p class="muted">
          Ít nhất 12 ký tự, tối đa 72 byte UTF-8. Không chia sẻ liên kết khôi phục.
        </p>
        <button type="submit" disabled>Đổi mật khẩu</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p><a href="/login">← Về đăng nhập</a></p>
    </main>
  </body>
</html>
