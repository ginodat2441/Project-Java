spring.application.name=clothing-shop
server.port=8080

# ===== Oracle =====
# Oracle Database Free local service; override with SPRING_DATASOURCE_URL for other instances.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=CLOTHING_SHOP
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Không tự chạy schema.sql (script có PL/SQL, hãy chạy bằng SQL Developer / SQL*Plus)
spring.sql.init.mode=never

# In SQL + tham số ra console để học/debug
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
shop.upload-dir=${SHOP_UPLOAD_DIR:${user.home}/clothing-shop-uploads}
shop.private-dir=${SHOP_PRIVATE_DIR:${user.home}/clothing-shop-private}
shop.reset.delivery=${SHOP_RESET_DELIVERY:local}
shop.reset.base-url=${SHOP_RESET_BASE_URL:http://localhost:8080}
shop.reset.from=${SHOP_RESET_FROM:no-reply@localhost}
spring.mail.properties.mail.smtp.auth=${SHOP_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SHOP_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SHOP_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SHOP_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
