spring.application.name=clothing-shop
server.port=8080

# ===== Oracle =====
# XE 21c: service name thường là XEPDB1 ; XE 11g: dùng jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=CLOTHING_SHOP
spring.datasource.password=changeme
spring.datasource.hikari.maximum-pool-size=5

# Không tự chạy schema.sql (script có PL/SQL, hãy chạy bằng SQL Developer / SQL*Plus)
spring.sql.init.mode=never

# In SQL + tham số ra console để học/debug
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

spring.jackson.time-zone=Asia/Ho_Chi_Minh
