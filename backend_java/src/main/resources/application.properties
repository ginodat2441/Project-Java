spring.application.name=clothing-shop
server.port=8080

# ===== Oracle =====
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=webshop
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=5

# Không tự chạy schema.sql (script có PL/SQL, hãy chạy bằng SQL Developer / SQL*Plus)
spring.sql.init.mode=never

# Log SQL statements without bind values so credential data stays out of logs.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=DEBUG

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Configure with a randomly generated secret of at least 32 characters.
app.security.jwt-secret=${JWT_SECRET:abcdabcdabcdabcdabcdabcdabcdabcd}
app.security.admin-bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN:123456789123456789123456789123456789}
app.order.shipping-fee=${ORDER_SHIPPING_FEE:30000}
